<!DOCTYPE html>
<html>
<head>
    <title>Neo4j Graph Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f5f5f5;
        }
        #graph {
            width: 100vw;
            height: 100vh;
        }
        .node {
            stroke: #fff;
            stroke-width: 1.5px;
        }
        .link {
            stroke: #999;
            stroke-opacity: 0.6;
        }
        .node-label {
            font-size: 12px;
            font-family: Arial;
        }
        .tooltip {
            position: absolute;
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            pointer-events: none;
            font-size: 12px;
            font-family: Arial;
        }
        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        select {
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .legend-text {
            font-size: 12px;
            font-family: Arial;
        }
    </style>
</head>
<body>
    <div id="graph"></div>
    <div class="tooltip" style="display: none;"></div>
    <div class="legend"></div>
    <div class="controls">
        <select id="graph-selector">
            <!-- Options will be populated by JavaScript -->
        </select>
    </div>

    <script>
        // Configuration
        const config = {
            width: window.innerWidth,
            height: window.innerHeight,
            nodeRadius: 24, // Increased node size to 48px wide
            linkDistance: 100,
            charge: -1000,
            minZoom: 0.01,
            maxZoom: 4,
            currentGraphId: 'default' // Default graph ID
        };

        // Color scheme for different node types
        const colorScheme = d3.scaleOrdinal(d3.schemeCategory10);

        // Create SVG
        const svg = d3.select("#graph")
            .append("svg")
            .attr("width", config.width)
            .attr("height", config.height);

        // Create a group for all elements that will be transformed
        const g = svg.append("g");

        // Create tooltip
        const tooltip = d3.select(".tooltip");

        // Create zoom behavior
        const zoom = d3.zoom()
            .scaleExtent([config.minZoom, config.maxZoom])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        // Apply zoom behavior to SVG
        svg.call(zoom);

        // Create simulation
        const simulation = d3.forceSimulation()
            .force("link", d3.forceLink().id(d => d.id).distance(config.linkDistance))
            .force("charge", d3.forceManyBody().strength(config.charge))
            .force("center", d3.forceCenter(config.width / 2, config.height / 2));

        // Function to create legend
        function createLegend(nodeTypes) {
            const legend = d3.select(".legend");
            legend.selectAll("*").remove();

            nodeTypes.forEach(type => {
                const item = legend.append("div")
                    .attr("class", "legend-item");
                
                item.append("div")
                    .attr("class", "legend-color")
                    .style("background-color", colorScheme(type));
                
                item.append("div")
                    .attr("class", "legend-text")
                    .text(type);
            });
        }

        // Fetch data from Neo4j
        async function fetchGraphData() {
            try {
                const response = await fetch('http://localhost:7474/db/neo4j/tx/commit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Basic ' + btoa('neo4j:password')
                    },
                    body: JSON.stringify({
                        statements: [{
                            statement: `
                                MATCH (n {graph_id: $graphId})
                                OPTIONAL MATCH (n)-[r]->(m {graph_id: $graphId})
                                RETURN n, r, m
                            `,
                            parameters: {
                                graphId: config.currentGraphId
                            },
                            resultDataContents: ["graph"]
                        }]
                    })
                });

                const data = await response.json();
                return processNeo4jData(data);
            } catch (error) {
                console.error('Error fetching data:', error);
                return { nodes: [], links: [] };
            }
        }

        // Process Neo4j data into D3 format
        function processNeo4jData(data) {
            const nodes = new Map();
            const links = [];
            const nodeTypes = new Set();

            data.results[0].data.forEach(row => {
                // Process nodes
                if (row.graph.nodes) {
                    row.graph.nodes.forEach(node => {
                        if (!nodes.has(node.id)) {
                            const type = node.labels[0];
                            nodeTypes.add(type);
                            nodes.set(node.id, {
                                id: node.id,
                                label: node.properties.displayName || node.id,
                                type: type
                            });
                        }
                    });
                }

                // Process relationships
                if (row.graph.relationships) {
                    row.graph.relationships.forEach(rel => {
                        links.push({
                            source: rel.startNode,
                            target: rel.endNode,
                            type: rel.type,
                            properties: rel.properties
                        });
                    });
                }
            });

            // Create legend with all node types
            createLegend(Array.from(nodeTypes));

            return {
                nodes: Array.from(nodes.values()),
                links: links
            };
        }

        // Fetch available graph IDs
        async function fetchGraphIds() {
            try {
                const response = await fetch('http://localhost:7474/db/neo4j/tx/commit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Basic ' + btoa('neo4j:password')
                    },
                    body: JSON.stringify({
                        statements: [{
                            statement: `
                                MATCH (n)
                                WHERE n.graph_id IS NOT NULL
                                RETURN DISTINCT n.graph_id
                            `
                        }]
                    })
                });

                const data = await response.json();
                console.log(response);
                return data.results[0].data.map(row => row.row[0]);
            } catch (error) {
                console.error('Error fetching graph IDs:', error);
                return ['default'];
            }
        }

        // Populate graph selector
        async function populateGraphSelector() {
            const graphIds = await fetchGraphIds();
            const selector = document.getElementById('graph-selector');
            
            selector.innerHTML = '';
            graphIds.forEach(id => {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = id;
                if (id === config.currentGraphId) {
                    option.selected = true;
                }
                selector.appendChild(option);
            });

            // Add event listener
            selector.addEventListener('change', function() {
                config.currentGraphId = this.value;
                // Clear existing graph
                g.selectAll('*').remove();
                // Render new graph
                renderGraph();
            });
        }

        // Render the graph
        async function renderGraph() {
            const graphData = await fetchGraphData();

            // Clear existing graph elements
            g.selectAll('*').remove();

            // Create links
            const link = g.append("g")
                .selectAll("line")
                .data(graphData.links)
                .enter()
                .append("line")
                .attr("class", "link");

            // Create nodes
            const node = g.append("g")
                .selectAll("circle")
                .data(graphData.nodes)
                .enter()
                .append("circle")
                .attr("class", "node")
                .attr("r", config.nodeRadius)
                .style("fill", d => colorScheme(d.type))
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));

            // Add labels
            const label = g.append("g")
                .selectAll("text")
                .data(graphData.nodes)
                .enter()
                .append("text")
                .attr("class", "node-label")
                .text(d => d.label)
                .attr("x", config.nodeRadius + 2)
                .attr("y", 3);

            // Add tooltips
            node.on("mouseover", function(event, d) {
                tooltip.style("display", "block")
                    .html(`
                        <strong>${d.label}</strong><br/>
                        Type: ${d.type}<br/>
                        ID: ${d.id}
                    `)
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 10) + "px");
            })
            .on("mouseout", function() {
                tooltip.style("display", "none");
            });

            // Update positions
            simulation.nodes(graphData.nodes)
                .on("tick", () => {
                    link
                        .attr("x1", d => d.source.x)
                        .attr("y1", d => d.source.y)
                        .attr("x2", d => d.target.x)
                        .attr("y2", d => d.target.y);

                    node
                        .attr("cx", d => d.x)
                        .attr("cy", d => d.y);

                    label
                        .attr("x", d => d.x + config.nodeRadius + 2)
                        .attr("y", d => d.y + 3);
                });

            simulation.force("link")
                .links(graphData.links);

            // Reset zoom to initial position
            svg.call(zoom.transform, d3.zoomIdentity);
        }

        // Drag functions
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            config.width = window.innerWidth;
            config.height = window.innerHeight;
            svg.attr("width", config.width)
               .attr("height", config.height);
            simulation.force("center", d3.forceCenter(config.width / 2, config.height / 2));
            simulation.alpha(0.3).restart();
        });

        // Start the visualization
        populateGraphSelector().then(() => {
            renderGraph();
        });
    </script>
</body>
</html>
