<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo4j Graph Visualization with AntV G6</title>
    <script src="https://gw.alipayobjects.com/os/lib/antv/g6/5.0.48/dist/g6.min.js"></script>
    <style>
        #container {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            margin: 0 auto;
        }
        .control-panel {
            margin: 10px 0;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 4px;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="control-panel">
        <label for="graphId">Graph ID:</label>
        <input type="text" id="graphId" value="default">
        <button onclick="loadGraph()">Load Graph</button>
        <select id="layout">
            <option value="force">Force</option>
            <option value="circular">Circular</option>
            <option value="dagre">Hierarchical</option>
            <option value="concentric">Concentric</option>
            <option value="grid">Grid</option>
        </select>
        <button onclick="changeLayout()">Change Layout</button>
    </div>
    <div id="container">
        <div class="loading" id="loading">Loading...</div>
    </div>

    <script>
        // Configuration
        const config = {
            currentGraphId: 'default',
            neo4jUrl: 'http://localhost:7474/db/neo4j/tx/commit',
            username: 'neo4j',
            password: 'password'
        };

        // Global graph instance
        let graph = null;

        // Process Neo4j data to G6 format
        function processNeo4jData(data) {
            const nodesMap = new Map();
            const edges = [];
            
            if (!data.results || !data.results[0] || !data.results[0].data) {
                return { nodes: [], edges: [] };
            }
            
            // Process each record in the result
            data.results[0].data.forEach(record => {
                // Process graph data
                if (record.graph) {
                    // Process nodes
                    record.graph.nodes.forEach(node => {
                        if (!nodesMap.has(node.id)) {
                            nodesMap.set(node.id, {
                                id: node.id,
                                label: node.properties.name || node.labels[0] || `Node ${node.id}`,
                                style: {
                                    fill: getNodeColor(node.labels[0]),
                                    stroke: '#666'
                                },
                                labelCfg: {
                                    style: {
                                        fill: '#000',
                                        fontSize: 12
                                    }
                                },
                                // Store original properties for tooltip
                                properties: node.properties,
                                type: node.labels[0]
                            });
                        }
                    });
                    
                    // Process relationships (edges)
                    record.graph.relationships.forEach(rel => {
                        edges.push({
                            id: rel.id,
                            source: rel.startNode,
                            target: rel.endNode,
                            label: rel.type,
                            style: {
                                stroke: '#aaa',
                                lineWidth: 1.5,
                                endArrow: true
                            },
                            labelCfg: {
                                style: {
                                    fill: '#666',
                                    fontSize: 10
                                }
                            },
                            // Store original properties for tooltip
                            properties: rel.properties
                        });
                    });
                }
            });
            
            // Convert nodesMap to array
            const nodes = Array.from(nodesMap.values());
            
            return { nodes, edges };
        }

        // Get node color based on label
        function getNodeColor(label) {
            const colors = {
                Person: '#91d5ff',
                Movie: '#b7eb8f',
                Book: '#ffadd2',
                Company: '#87e8de',
                Product: '#ffd666',
                Category: '#d3adf7'
            };
            
            return colors[label] || '#bfbfbf';
        }

        // Fetch data from Neo4j
        async function fetchGraphData() {
            try {
                const response = await fetch(config.neo4jUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Basic ' + btoa(`${config.username}:${config.password}`)
                    },
                    body: JSON.stringify({
                        statements: [{
                            statement: `
                                MATCH (n {graph_id: $graphId})
                                OPTIONAL MATCH (n)-[r]->(m {graph_id: $graphId})
                                RETURN n, r, m
                                LIMIT 1000
                            `,
                            parameters: {
                                graphId: config.currentGraphId
                            },
                            resultDataContents: ["graph"]
                        }]
                    })
                });

                const data = await response.json();
                return processNeo4jData(data);
            } catch (error) {
                console.error('Error fetching data:', error);
                return { nodes: [], edges: [] };
            }
        }

        // Initialize graph visualization
        async function initGraph() {
            document.getElementById('loading').style.display = 'block';
            
            try {
                const data = await fetchGraphData();
                
                if (!data.nodes.length) {
                    document.getElementById('loading').textContent = 'No data found. Check your Neo4j connection and graph ID.';
                    return;
                }
                
                // Create graph container
                const container = document.getElementById('container');
                
                // Initialize G6 graph
                graph = new G6.Graph({
                    container: 'container',
                    width: container.scrollWidth,
                    height: container.scrollHeight,
                    modes: {
                        default: ['drag-canvas', 'zoom-canvas', 'drag-node']
                    },
                    layout: {
                        type: 'force',
                        preventOverlap: true,
                        linkDistance: 150,
                        nodeStrength: -100,
                        edgeStrength: 0.1
                    },
                    defaultNode: {
                        size: 30,
                        type: 'circle',
                        style: {
                            fill: '#5B8FF9',
                            stroke: '#666',
                            lineWidth: 1
                        },
                        labelCfg: {
                            position: 'bottom',
                            offset: 10,
                            style: {
                                fill: '#000',
                                fontSize: 12
                            }
                        }
                    },
                    defaultEdge: {
                        type: 'line',
                        style: {
                            stroke: '#aaa',
                            lineWidth: 1.5,
                            endArrow: true
                        },
                        labelCfg: {
                            autoRotate: true,
                            style: {
                                fill: '#666',
                                fontSize: 10
                            }
                        }
                    },
                    // Add tooltips
                    nodeStateStyles: {
                        hover: {
                            lineWidth: 3
                        }
                    },
                    edgeStateStyles: {
                        hover: {
                            stroke: '#3C9AE8'
                        }
                    }
                });

                // Add tooltip behavior
                graph.on('node:mouseenter', (e) => {
                    const node = e.item;
                    const properties = node.get('model').properties;
                    
                    // Create tooltip content
                    let content = `<div style="padding: 10px; background: rgba(255,255,255,0.9); border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">`;
                    content += `<div><strong>Type:</strong> ${node.get('model').type || 'Node'}</div>`;
                    
                    // Add all properties
                    for (const [key, value] of Object.entries(properties)) {
                        if (key !== 'graph_id') {
                            content += `<div><strong>${key}:</strong> ${value}</div>`;
                        }
                    }
                    content += `</div>`;
                    
                    // Create tooltip element
                    const tooltip = document.createElement('div');
                    tooltip.id = 'g6-tooltip';
                    tooltip.innerHTML = content;
                    tooltip.style.position = 'absolute';
                    tooltip.style.left = e.canvasX + 10 + 'px';
                    tooltip.style.top = e.canvasY + 10 + 'px';
                    tooltip.style.zIndex = 9999;
                    document.body.appendChild(tooltip);
                    
                    // Highlight node
                    graph.setItemState(node, 'hover', true);
                });

                graph.on('node:mouseleave', (e) => {
                    // Remove tooltip
                    const tooltip = document.getElementById('g6-tooltip');
                    if (tooltip) {
                        document.body.removeChild(tooltip);
                    }
                    
                    // Remove highlight
                    graph.setItemState(e.item, 'hover', false);
                });

                // Handle edge tooltips similarly
                graph.on('edge:mouseenter', (e) => {
                    const edge = e.item;
                    const properties = edge.get('model').properties;
                    
                    let content = `<div style="padding: 10px; background: rgba(255,255,255,0.9); border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">`;
                    content += `<div><strong>Type:</strong> ${edge.get('model').label || 'Relationship'}</div>`;
                    
                    for (const [key, value] of Object.entries(properties)) {
                        content += `<div><strong>${key}:</strong> ${value}</div>`;
                    }
                    content += `</div>`;
                    
                    const tooltip = document.createElement('div');
                    tooltip.id = 'g6-tooltip';
                    tooltip.innerHTML = content;
                    tooltip.style.position = 'absolute';
                    tooltip.style.left = e.canvasX + 10 + 'px';
                    tooltip.style.top = e.canvasY + 10 + 'px';
                    tooltip.style.zIndex = 9999;
                    document.body.appendChild(tooltip);
                    
                    graph.setItemState(edge, 'hover', true);
                });

                graph.on('edge:mouseleave', (e) => {
                    const tooltip = document.getElementById('g6-tooltip');
                    if (tooltip) {
                        document.body.removeChild(tooltip);
                    }
                    graph.setItemState(e.item, 'hover', false);
                });

                // Handle window resize
                window.addEventListener('resize', () => {
                    if (graph) {
                        graph.changeSize(container.scrollWidth, container.scrollHeight);
                    }
                });

                // Render data
                graph.data(data);
                graph.render();
                
                // Add some fit view and centering
                graph.fitView(20);
                
                // Hide loading indicator
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Error initializing graph:', error);
                document.getElementById('loading').textContent = 'Error loading graph: ' + error.message;
            }
        }

        // Load graph with selected ID
        function loadGraph() {
            if (graph) {
                graph.destroy();
            }
            
            config.currentGraphId = document.getElementById('graphId').value;
            initGraph();
        }

        // Change layout
        function changeLayout() {
            if (!graph) return;
            
            const layoutType = document.getElementById('layout').value;
            let layoutConfig;
            
            switch (layoutType) {
                case 'force':
                    layoutConfig = {
                        type: 'force',
                        preventOverlap: true,
                        linkDistance: 150,
                        nodeStrength: -100,
                        edgeStrength: 0.1
                    };
                    break;
                case 'circular':
                    layoutConfig = {
                        type: 'circular',
                        radius: 200,
                        divisions: 5,
                        preventOverlap: true,
                        nodeSpacing: 30
                    };
                    break;
                case 'dagre':
                    layoutConfig = {
                        type: 'dagre',
                        rankdir: 'TB',
                        align: 'UL',
                        nodesep: 20,
                        ranksep: 50
                    };
                    break;
                case 'concentric':
                    layoutConfig = {
                        type: 'concentric',
                        preventOverlap: true,
                        minNodeSpacing: 30
                    };
                    break;
                case 'grid':
                    layoutConfig = {
                        type: 'grid',
                        preventOverlap: true
                    };
                    break;
                default:
                    layoutConfig = {
                        type: 'force',
                        preventOverlap: true
                    };
            }
            
            graph.updateLayout(layoutConfig);
        }

        // Initialize when page loads
        window.onload = initGraph;
    </script>
</body>
</html>
