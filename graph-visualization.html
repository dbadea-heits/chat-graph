<!DOCTYPE html>
<html>
<head>
    <title>Neo4j Graph Visualization</title>
    <script src="https://gw.alipayobjects.com/os/lib/antv/g6/4.8.24/dist/g6.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f5f5f5;
        }
        #graph {
            width: 100vw;
            height: 100vh;
        }
        .tooltip {
            position: absolute;
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            pointer-events: none;
            font-size: 12px;
            font-family: Arial;
        }
        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        select {
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .legend-text {
            font-size: 12px;
            font-family: Arial;
        }
    </style>
</head>
<body>
    <div id="graph"></div>
    <div class="tooltip" style="display: none;"></div>
    <div class="legend"></div>
    <div class="controls">
        <select id="graph-selector">
            <!-- Options will be populated by JavaScript -->
        </select>
    </div>

    <script>
        // Configuration
        const config = {
            width: window.innerWidth,
            height: window.innerHeight,
            nodeSize: 24,
            edgeSize: 1,
            minZoom: 0.01,
            maxZoom: 4,
            currentGraphId: 'default' // Default graph ID
        };

        // Color scheme for different node types
        const colorMap = {};
        const colors = [
            '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', 
            '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', 
            '#bcbd22', '#17becf'
        ];
        let colorIndex = 0;

        // Create tooltip
        const tooltip = document.querySelector(".tooltip");

        // Function to create legend
        function createLegend(nodeTypes) {
            const legend = document.querySelector(".legend");
            legend.innerHTML = '';

            nodeTypes.forEach(type => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                
                const colorDiv = document.createElement('div');
                colorDiv.className = 'legend-color';
                colorDiv.style.backgroundColor = colorMap[type];
                
                const textDiv = document.createElement('div');
                textDiv.className = 'legend-text';
                textDiv.textContent = type;
                
                item.appendChild(colorDiv);
                item.appendChild(textDiv);
                legend.appendChild(item);
            });
        }

        // Fetch data from Neo4j
        async function fetchGraphData() {
            try {
                const response = await fetch('http://localhost:7474/db/neo4j/tx/commit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Basic ' + btoa('neo4j:password')
                    },
                    body: JSON.stringify({
                        statements: [{
                            statement: `
                                MATCH (n {graph_id: $graphId})
                                OPTIONAL MATCH (n)-[r]->(m {graph_id: $graphId})
                                RETURN n, r, m
                                LIMIT 1000
                            `,
                            parameters: {
                                graphId: config.currentGraphId
                            },
                            resultDataContents: ["graph"]
                        }]
                    })
                });

                const data = await response.json();
                return processNeo4jData(data);
            } catch (error) {
                console.error('Error fetching data:', error);
                return { nodes: [], edges: [] };
            }
        }

        // Process Neo4j data into G6 format
        function processNeo4jData(data) {
            const nodesMap = new Map();
            const edges = [];
            const nodeTypes = new Set();

            data.results[0].data.forEach(row => {
                // Process nodes
                if (row.graph.nodes) {
                    row.graph.nodes.forEach(node => {
                        if (!nodesMap.has(node.id)) {
                            const type = node.labels[0];
                            nodeTypes.add(type);
                            
                            // Assign color to type if not already assigned
                            if (!colorMap[type]) {
                                colorMap[type] = colors[colorIndex % colors.length];
                                colorIndex++;
                            }
                            
                            nodesMap.set(node.id, {
                                id: node.id,
                                label: node.properties.displayName || node.id,
                                type: type,
                                style: {
                                    fill: colorMap[type]
                                }
                            });
                        }
                    });
                }

                // Process relationships
                if (row.graph.relationships) {
                    row.graph.relationships.forEach(rel => {
                        edges.push({
                            id: rel.id,
                            source: rel.startNode,
                            target: rel.endNode,
                            label: rel.type
                        });
                    });
                }
            });

            // Create legend with all node types
            createLegend(Array.from(nodeTypes));

            return {
                nodes: Array.from(nodesMap.values()),
                edges: edges
            };
        }

        // Fetch available graph IDs
        async function fetchGraphIds() {
            try {
                const response = await fetch('http://localhost:7474/db/neo4j/tx/commit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Basic ' + btoa('neo4j:password')
                    },
                    body: JSON.stringify({
                        statements: [{
                            statement: `
                                MATCH (n)
                                WHERE n.graph_id IS NOT NULL
                                RETURN DISTINCT n.graph_id
                            `
                        }]
                    })
                });

                const data = await response.json();
                console.log(response);
                return data.results[0].data.map(row => row.row[0]);
            } catch (error) {
                console.error('Error fetching graph IDs:', error);
                return ['default'];
            }
        }

        // Populate graph selector
        async function populateGraphSelector() {
            const graphIds = await fetchGraphIds();
            const selector = document.getElementById('graph-selector');
            
            selector.innerHTML = '';
            graphIds.forEach(id => {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = id;
                if (id === config.currentGraphId) {
                    option.selected = true;
                }
                selector.appendChild(option);
            });

            // Add event listener
            selector.addEventListener('change', function() {
                config.currentGraphId = this.value;
                // Render new graph
                renderGraph();
            });
        }

        let graph = null;

        // Render the graph
        async function renderGraph() {
            const graphData = await fetchGraphData();

            // Destroy previous graph instance if exists
            if (graph) {
                graph.destroy();
            }

            // Initialize the Graph
            graph = new G6.Graph({
                container: 'graph',
                width: config.width,
                height: config.height,
                modes: {
                    default: ['drag-canvas', 'zoom-canvas', 'drag-node']
                },
                defaultNode: {
                    size: config.nodeSize,
                    type: 'circle',
                    labelCfg: {
                        position: 'right',
                        offset: 5
                    },
                    style: {
                        stroke: '#fff',
                        lineWidth: 1.5
                    }
                },
                defaultEdge: {
                    type: 'line',
                    style: {
                        stroke: '#999',
                        lineWidth: config.edgeSize,
                        opacity: 0.6,
                        endArrow: {
                            path: G6.Arrow.triangle(8, 8, 0),
                            fill: '#999'
                        }
                    },
                    labelCfg: {
                        autoRotate: true,
                        style: {
                            fontSize: 10
                        }
                    }
                },
                layout: {
                    type: 'force',
                    preventOverlap: true,
                    linkDistance: 100,
                    nodeStrength: -1000,
                    nodeSpacing: 50
                },
                minZoom: config.minZoom,
                maxZoom: config.maxZoom,
                fitView: true,
                animate: true
            });

            // Load data
            graph.data(graphData);
            graph.render();

            // Add node interaction events
            graph.on('node:mouseenter', (e) => {
                const node = e.item;
                const model = node.getModel();
                
                // Show tooltip
                tooltip.style.display = 'block';
                tooltip.innerHTML = `
                    <strong>${model.label}</strong><br/>
                    Type: ${model.type}<br/>
                    ID: ${model.id}
                `;
                tooltip.style.left = (e.clientX + 10) + 'px';
                tooltip.style.top = (e.clientY - 10) + 'px';
                
                // Highlight node
                graph.setItemState(node, 'hover', true);
            });

            graph.on('node:mouseleave', (e) => {
                // Hide tooltip
                tooltip.style.display = 'none';
                
                // Remove highlight
                graph.setItemState(e.item, 'hover', false);
            });

            graph.on('canvas:click', () => {
                tooltip.style.display = 'none';
            });
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            if (graph) {
                config.width = window.innerWidth;
                config.height = window.innerHeight;
                graph.changeSize(config.width, config.height);
                graph.fitView();
            }
        });

        // Start the visualization
        populateGraphSelector().then(() => {
            renderGraph();
        });
    </script>
</body>
</html>
